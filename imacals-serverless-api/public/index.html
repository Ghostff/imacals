<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>imacals API</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #0e1013;
      color: #ecedee;
      text-align: center;
    }
    .card {
      background: #17191c;
      padding: 32px 48px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
    }
    h1 { margin: 0 0 8px 0; color: #b4ff39; font-size: 1.75rem; }
    p { color: #9ca3af; margin: 0 0 16px 0; font-size: 0.95rem; }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(180, 255, 57, 0.15);
      color: #b4ff39;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>imacals Serverless API</h1>
    <p>Backend services powered by Supabase & Vercel Serverless Functions</p>
    <span class="badge">● Operational</span>
  </div>
</body>
</html>
